name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ekil1100/pi-cpt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`Release tag must match package.json: expected ${expected}`);
          }
          NODE

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2; reads packageManager

      - name: Install npm with OIDC support
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prepublishOnly runs formatting, lint, type checks, tests, and the build.
      # npm obtains a short-lived OIDC credential; no npm token secret is needed.
      - name: Validate, build, and publish
        run: npm publish --access public
